name: Generate PDF from Markdown

on:
  push:
    branches:
      - main

jobs:
  convert-to-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Output Folder
        run: mkdir -p final_pdfs

      - name: Run Pandoc PDF Converter
        uses: docker://pandoc/latex:latest
        with:
          args: --output=final_pdfs/document.pdf *.md
          # This automatically finds ANY .md file in your main folder and builds one PDF

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: latest-document-pdf
          path: final_pdfs/
