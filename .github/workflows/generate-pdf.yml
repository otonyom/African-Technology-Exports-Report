name: Generate PDF from Markdown

on:
  push:
    branches:
      - main  # Runs automatically whenever you update the main branch

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Convert Markdown to PDF
        uses: baileyjm02/markdown-to-pdf@v1
        with:
          input_path: docs/          # The folder where you keep your .md files
          output_dir: pdf_outputs/   # Where the finished PDFs will be saved
          build_html: false

      - name: Commit and Push PDFs to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          mkdir -p final_pdfs
          cp pdf_outputs/* final_pdfs/
          git add final_pdfs/
          git commit -m "Automated PDF generation [skip ci]" || echo "No changes to commit"
          git push

