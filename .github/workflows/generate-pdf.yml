name: Generate PDF from Markdown

on:
  push:
    branches:
      - main
  workflow_dispatch: # 👈 This line adds a manual "Run workflow" button to GitHub

jobs:
  convert-to-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Output Folder
        run: mkdir -p final_pdfs

      - name: Run Pandoc PDF Converter
        run: |
          for file in *.md; do
            [ -e "$file" ] || continue
            filename="${file%.md}"
            echo "Converting $file to final_pdfs/${filename}.pdf..."
            docker run --rm -v ${{ github.workspace }}:/data pandoc/latex:latest --output="final_pdfs/${filename}.pdf" "$file"
          done

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: latest-document-pdfs
          path: final_pdfs/
