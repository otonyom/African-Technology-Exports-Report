name: Generate PDF from Markdown

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  convert-to-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Output Folder
        run: mkdir -p final_pdfs

      - name: Run Pandoc PDF Converter
        run: |
          for file in *.md; do
            [ -e "$file" ] || continue
            filename="${file%.md}"
            echo "Converting $file to final_pdfs/${filename}.pdf..."
            docker run --rm -v ${{ github.workspace }}:/data pandoc/latex:latest --output="final_pdfs/${filename}.pdf" "$file"
          done

      - name: Commit and Push PDFs Directly to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Stage the freshly generated PDFs
          git add final_pdfs/*.pdf
          
          # Commit only if changes exist, avoiding empty failure runs
          git commit -m "Automated PDF update [skip ci]" || echo "No changes to commit"
          git push
